<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ladyland · Logo Generator</title>
<style>
:root{color-scheme:dark;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#dfe8e3;background:#101713;--line:#2b3830;--mint:#61c594}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button,.file{background:transparent;color:inherit;border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}button:hover,.file:hover{background:#283b2e}button:disabled{opacity:.4;cursor:default}button[aria-pressed=true],button.primary{background:var(--mint);color:#0a2116;border-color:var(--mint)}button:focus-visible,input:focus-visible,.file:focus-within{outline:2px solid var(--mint);outline-offset:3px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 22px;border-bottom:1px solid var(--line)}h1{font-size:20px;letter-spacing:-.5px;margin:0}header small{color:#93a79a;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}main{display:grid;grid-template-columns:minmax(0,1fr) 310px;height:calc(100dvh - 79px)}.work{display:flex;flex-direction:column;min-width:0;padding:16px 22px}.toolbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.tabs{display:flex;gap:6px}#viewport{flex:1;min-height:300px;position:relative;overflow:hidden;background:radial-gradient(ellipse at center,#26382e 0,#16231b 70%);border-radius:8px;margin-top:12px}#flat,#scene{position:absolute;width:100%;height:100%;inset:0}#flat{display:grid;place-items:center}#flat svg{width:100%;height:100%;max-height:100%;object-fit:contain}#scene{touch-action:none}#flat[hidden],#scene[hidden]{display:none}.hint{position:absolute;bottom:14px;left:16px;color:#a4b9ab;font-size:12px;pointer-events:none}.caption{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:16px 0 8px}.wordmark{font-size:32px;letter-spacing:-1.5px;font-weight:600}.caption small{color:#8ba393}#sizes{display:flex;align-items:center;gap:18px}#sizes svg{display:block}.preview-size{text-align:center;color:#8ba393;font-size:11px}.preview-size span{display:block;margin-top:4px}#status{margin:8px 0 0;min-height:22px;font-size:13px;color:#a7bbad}aside{border-left:1px solid var(--line);overflow-y:auto;padding:4px 18px 18px}details{border-bottom:1px solid var(--line);padding:12px 0}summary{font-weight:600;cursor:pointer;margin-bottom:10px}.field{display:block;margin:10px 0}.field-head{display:flex;justify-content:space-between;gap:12px;font-size:13px}.field output{color:#91ae9c;font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:var(--mint);margin:8px 0 0}input[type=color]{width:100%;height:28px;border:0;padding:0;background:none;margin-top:6px}.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.tiles button{height:35px;padding:0;font-size:12px}.note{font-size:12px;color:#91a699;margin:10px 0}footer{padding-top:16px;display:flex;flex-direction:column;gap:8px}.file{text-align:center;position:relative}.file input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}@media(max-width:740px){header{padding:12px;align-items:flex-start}header small{display:none}main{height:auto;grid-template-columns:1fr}.work{padding:12px}#viewport{height:55vh;flex:none}aside{border-left:0;border-top:1px solid var(--line);overflow:visible}.caption{gap:10px}.wordmark{font-size:28px}#sizes{gap:8px}}
</style></head><body>
<header><div><h1>Ladyland <small>／ Logo Generator</small></h1></div><div class="actions"><button id="save" class="primary">保存</button><button id="svg-export">編集用SVG</button><button id="png-export">PNG 2048px</button></div></header>
<main><section class="work"><div class="toolbar"><div class="tabs"><button id="view-2d" aria-pressed="true">2D · 正面</button><button id="view-3d" aria-pressed="false">3D · 厚み</button></div><div class="tabs"><button id="reset-camera" hidden>正面へ</button><button id="transparent" aria-pressed="false">透過PNG</button></div></div><div id="viewport"><div id="flat"></div><canvas id="scene" hidden></canvas><span class="hint" id="hint">4 × 3 ／ 一灯の billboard</span></div><div class="caption"><div><div class="wordmark">ladyland</div><small>Electric ladies live here.</small></div><div id="sizes" aria-label="小サイズのプレビュー"></div></div><p id="status" role="status">読み込み中…</p></section>
<aside><details open><summary>形</summary><div id="shape-controls"></div></details><details open><summary>点灯する楽器</summary><div id="tile-controls" class="tiles"></div></details><details open><summary>色と発光</summary><div id="color-controls"></div></details><details><summary>質感と光 · 3D</summary><div id="light-controls"></div></details><footer><button id="revert">保存値に戻す</button><label class="file">SVGを読み込む<input id="import" type="file" accept=".svg,image/svg+xml" aria-label="SVGを読み込む"></label><p class="note">「保存」で調整を残せます。PNGは現在の表示を書き出します。下の文字はプレビュー用です。</p></footer></aside></main>
<script id="studio-data" type="application/json">__STUDIO_DATA__</script><script src="./studio.js"></script></body></html>
